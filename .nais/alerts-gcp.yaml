      # Sjekker om det er feil ved selftest
      - alert: Feil i selftest
        expr: selftests_aggregate_result_status{namespace="{{ namespace }}"} > 0
        for: 1m
        annotations:
          consequence: '*\{{ $labels.app }}* har feil i selftest.'
          action: "Sjekk \{{ $labels.app }} i \{{ $labels.namespace }} sin selftest for å se hva som er galt."
        labels:
          namespace: {{ namespace }}
          severity: warning
      # Sjekk om brukere ikke sender inn meldekort
      - alert: Brukere sender ikke inn meldekort
        expr: |
          (
             (sum(increase(meldekort_api_innsendte_meldekort_ok_total{namespace="{{ namespace }}", app="{{ meldekortApi }}"}[1m])) or vector(0)) < 1
          )
          and on()
          (
            (hour() >= 5) and (hour() < 21)
          )
        for: 10m
        annotations:
          consequence: '*{{ meldekortApi }}* har ikke mottatt innsendte meldekort på 10 minutter.'
          action: 'Sjekk aktuelt Grafana-dashboard.'
        labels:
          namespace: {{ namespace }}
          severity: warning
